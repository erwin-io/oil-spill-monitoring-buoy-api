name: API validation
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: One-command isolated local acceptance (Node + Firebase emulators)
        env:
          FIREBASE_PROJECT_ID: demo-oil-spill-monitoring-buoy-ci
          GCLOUD_PROJECT: demo-oil-spill-monitoring-buoy-ci
          GOOGLE_CLOUD_PROJECT: demo-oil-spill-monitoring-buoy-ci
          CI: 'true'
        run: npm run verify:local -- --skip-install

  windows-powershell-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify npm arguments are forwarded by the PowerShell orchestrator
        shell: pwsh
        run: |
          # Stub the sibling checkout and npm.cmd. No installs or Firebase writes.
          $mobile = Join-Path (Split-Path -Parent (Get-Location).Path) 'oil-spill-monitoring-buoy-app'
          New-Item -ItemType Directory -Force -Path $mobile | Out-Null
          Set-Content -LiteralPath (Join-Path $mobile 'package.json') -Value '{}'
          $stub = Join-Path $env:RUNNER_TEMP 'npm.cmd'
          @'
          @echo off
          echo %*>> "%RUNNER_TEMP%\npm-args.log"
          exit /b 0
          '@ | Set-Content -LiteralPath $stub
          $env:PATH = "$env:RUNNER_TEMP;$env:PATH"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-thesis.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell orchestrator failed: $LASTEXITCODE" }
          $calls = @(Get-Content (Join-Path $env:RUNNER_TEMP 'npm-args.log'))
          if ($calls.Count -ne 2 -or @($calls | Where-Object { $_ -notmatch '^\s*run\s+verify:local\s*$' }).Count -gt 0) {
            throw "Unexpected npm commands: $($calls -join '; ')"
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies for real Windows Firebase emulator test
        run: npm ci --no-audit --no-fund
      - name: Windows Auth and Firestore emulator integration
        shell: pwsh
        run: npm run verify:local -- --skip-install
      - name: Validate reusable telemetry lab PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'scripts/telemetry-lab.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Windows repeatable telemetry lab with isolated fixtures
        shell: pwsh
        run: |
          # Fresh-checkout run needs NO provider config when external sends
          # are disabled. It must complete telemetry rather than just copy a template.
          npm run sim:telemetry -- -Scenario normal -NoPush -NoPusher
          if ($LASTEXITCODE -ne 0) { throw 'First-run telemetry lab failed' }
          $report = Get-Content '.test-output/telemetry-lab-report.json' -Raw | ConvertFrom-Json
          if ($report.result -ne 'PASS' -or $report.scenario -ne 'normal' -or $report.fcmSendCount -ne 0) {
            throw 'Normal fixture must PASS without FCM'
          }
          # Existing repo .env must be automatically resolved without printing
          # any provider values or contacting live Pusher/FCM.
          @(
            'PUSHER_APP_ID=CI_DUMMY_APP'
            'PUSHER_KEY=CI_DUMMY_KEY'
            'PUSHER_SECRET=CI_DUMMY_SECRET'
            'PUSHER_CLUSTER=ap1'
          ) | Set-Content -LiteralPath '.env'
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/telemetry-lab.ps1 -Scenario normal -CheckConfig
            if ($LASTEXITCODE -ne 0) { throw 'Existing API .env auto-detection failed' }
            # Repo-local secret file should work when .env is absent; test
            # through the real PowerShell wrapper without sending anything.
            Remove-Item -LiteralPath '.env'
            Copy-Item 'scripts/telemetry-lab.config.example.json' 'scripts/telemetry-lab.config.json'
            $json = Get-Content 'scripts/telemetry-lab.config.json' -Raw | ConvertFrom-Json
            $json.pusher.appId = 'CI_REPO_APP'
            $json.pusher.key = 'CI_REPO_KEY'
            $json.pusher.secret = 'CI_REPO_SECRET'
            $json | ConvertTo-Json -Depth 8 | Set-Content 'scripts/telemetry-lab.config.json'
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/telemetry-lab.ps1 -Scenario normal -CheckConfig
            if ($LASTEXITCODE -ne 0) { throw 'Repo-local ignored JSON auto-detection failed' }
            git check-ignore scripts/telemetry-lab.config.json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Repo-local secret config MUST be gitignored' }
          } finally {
            Remove-Item '.env','scripts/telemetry-lab.config.json' -Force -ErrorAction SilentlyContinue
          }

  isolated-simulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Simulator HTTP -> Firestore -> outbox, NEVER cloud
        run: npm run sim:pipeline
      - name: Reusable scenario NORMAL stays realtime-only (no alert, no FCM)
        env:
          TELEMETRY_LAB_SCENARIO: normal
        run: npm run sim:pipeline
      - name: Reusable scenario ALL produces PETROLEUM and three health alerts
        env:
          TELEMETRY_LAB_SCENARIO: all
        run: npm run sim:pipeline
