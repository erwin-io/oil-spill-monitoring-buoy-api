name: API validation
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: One-command isolated local acceptance (Node + Firebase emulators)
        env:
          FIREBASE_PROJECT_ID: demo-oil-spill-monitoring-buoy-ci
          GCLOUD_PROJECT: demo-oil-spill-monitoring-buoy-ci
          GOOGLE_CLOUD_PROJECT: demo-oil-spill-monitoring-buoy-ci
          CI: 'true'
        run: npm run verify:local -- --skip-install

  windows-powershell-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify npm arguments are forwarded by the PowerShell orchestrator
        shell: pwsh
        run: |
          # Stub the sibling checkout and npm.cmd. No installs or Firebase writes.
          $mobile = Join-Path (Split-Path -Parent (Get-Location).Path) 'oil-spill-monitoring-buoy-app'
          New-Item -ItemType Directory -Force -Path $mobile | Out-Null
          Set-Content -LiteralPath (Join-Path $mobile 'package.json') -Value '{}'
          $stub = Join-Path $env:RUNNER_TEMP 'npm.cmd'
          @'
          @echo off
          echo %*>> "%RUNNER_TEMP%\npm-args.log"
          exit /b 0
          '@ | Set-Content -LiteralPath $stub
          $env:PATH = "$env:RUNNER_TEMP;$env:PATH"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-thesis.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell orchestrator failed: $LASTEXITCODE" }
          $calls = @(Get-Content (Join-Path $env:RUNNER_TEMP 'npm-args.log'))
          if ($calls.Count -ne 2 -or @($calls | Where-Object { $_ -notmatch '^\s*run\s+verify:local\s*$' }).Count -gt 0) {
            throw "Unexpected npm commands: $($calls -join '; ')"
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies for real Windows Firebase emulator test
        run: npm ci --no-audit --no-fund
      - name: Windows Auth and Firestore emulator integration
        shell: pwsh
        run: npm run verify:local -- --skip-install
      - name: Validate reusable telemetry lab PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'scripts/telemetry-lab.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Windows repeatable telemetry lab with isolated fixtures
        shell: pwsh
        run: |
          # First run creates private placeholder config, second exercises
          # the complete PowerShell wrapper without external providers.
          npm run sim:telemetry -- -Scenario normal -NoPush -NoPusher
          if ($LASTEXITCODE -ne 0) { throw 'Private config initialization failed' }
          npm run sim:telemetry -- -Scenario normal -NoPush -NoPusher
          if ($LASTEXITCODE -ne 0) { throw 'Repeatable telemetry lab failed' }
          $report = Get-Content '.test-output/telemetry-lab-report.json' -Raw | ConvertFrom-Json
          if ($report.result -ne 'PASS' -or $report.scenario -ne 'normal' -or $report.fcmSendCount -ne 0) {
            throw 'Normal fixture must PASS without FCM'
          }

  isolated-simulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Simulator HTTP -> Firestore -> outbox, NEVER cloud
        run: npm run sim:pipeline
      - name: Reusable scenario NORMAL stays realtime-only (no alert, no FCM)
        env:
          TELEMETRY_LAB_SCENARIO: normal
        run: npm run sim:pipeline
      - name: Reusable scenario ALL produces PETROLEUM and three health alerts
        env:
          TELEMETRY_LAB_SCENARIO: all
        run: npm run sim:pipeline
