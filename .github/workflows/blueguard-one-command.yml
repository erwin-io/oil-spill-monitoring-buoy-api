name: Verify BlueGuard one-command runner
on:
  push:
    branches: [main]
    paths:
      - test-blueguard.cmd
      - test-blueguard.ps1
      - tests/one-command.test.js
      - .github/workflows/blueguard-one-command.yml
      - scripts/verify-thesis.ps1
      - scripts/verify-local.mjs
      - scripts/emulator-ports.mjs
      - tests/emulator-ports.test.js
      - scripts/hold-emulator-default-ports.mjs
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo-one-command:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout API to sibling workspace
        uses: actions/checkout@v4
        with:
          path: oil-spill-monitoring-buoy-api
      - name: Checkout Mobile main to sibling workspace
        uses: actions/checkout@v4
        with:
          repository: erwin-io/oil-spill-monitoring-buoy-app
          ref: main
          path: oil-spill-monitoring-buoy-app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The exact defect was a previously running process occupying 8080.
      # Prove the command works with all legacy Firebase ports unavailable.
      - name: Occupy legacy Firebase ports without running an emulator
        shell: pwsh
        run: |
          $ready = Join-Path $env:RUNNER_TEMP 'blueguard-occupied-ports-ready.json'
          $out = Join-Path $env:RUNNER_TEMP 'blueguard-occupied-ports.stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'blueguard-occupied-ports.stderr.txt'
          $script = Join-Path $env:GITHUB_WORKSPACE 'oil-spill-monitoring-buoy-api\scripts\hold-emulator-default-ports.mjs'
          $holder = Start-Process -FilePath (Get-Command node).Source -ArgumentList @("`"$script`"", "`"$ready`"") -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          "BLUEGUARD_HOLDER_PID=$($holder.Id)" >> $env:GITHUB_ENV
          for ($i = 0; $i -lt 40; $i++) {
            if (Test-Path $ready) { break }
            if ($holder.HasExited) { throw "Port holder exited: $(Get-Content $err -Raw)" }
            Start-Sleep -Milliseconds 250
          }
          if (!(Test-Path $ready)) { throw 'Default-port blocker did not become ready' }
          $actual = Get-Content $ready -Raw | ConvertFrom-Json
          if ($actual.ports.Count -ne 5) { throw 'Did not occupy all default ports' }
          Write-Host "Default ports held: $($actual.ports -join ', ')"
      - name: Run exactly the manual Windows command with ports occupied
        shell: cmd
        run: call oil-spill-monitoring-buoy-api\test-blueguard.cmd
      - name: Stop only the test-owned port blocker
        if: always()
        shell: pwsh
        run: |
          if ($env:BLUEGUARD_HOLDER_PID) {
            Stop-Process -Id ([int]$env:BLUEGUARD_HOLDER_PID) -ErrorAction SilentlyContinue
          }
      - name: Preserve private test output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueguard-one-command-test-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            oil-spill-monitoring-buoy-api/.test-output/*validation.json
            oil-spill-monitoring-buoy-api/.test-output/blueguard-one-command-report.json
            oil-spill-monitoring-buoy-app/.test-output/*validation.json
